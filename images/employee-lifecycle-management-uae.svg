<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none">
  <defs>
    <linearGradient id="lineGrad" x1="100" y1="180" x2="1100" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00B4D8" stop-opacity="0.2"/>
      <stop offset="20%" stop-color="#00B4D8"/>
      <stop offset="80%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#00B4D8" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F2137"/>
      <stop offset="100%" stop-color="#1A3A5C"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2137" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background subtle container -->
  <rect x="20" y="20" width="1160" height="380" rx="20" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Connecting Line -->
  <line x1="120" y1="180" x2="1080" y2="180" stroke="url(#lineGrad)" stroke-width="3" stroke-dasharray="6 6"/>

  <!-- ================= STAGE 1 ================= -->
  <g transform="translate(120, 180)">
    <!-- Node -->
    <circle cx="0" cy="0" r="42" fill="#FFFFFF" stroke="#00B4D8" stroke-width="3" filter="url(#cardShadow)"/>
    <circle cx="0" cy="0" r="34" fill="#F0FDFA"/>
    <!-- Icon: Document with signature/check -->
    <path d="M-10 -12 h14 l6 6 v18 h-20 z" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="4 -12 4 -6 10 -6" fill="none" stroke="#00B4D8" stroke-width="1.8"/>
    <path d="M-6 4 l3 3 7 -7" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stage Pill -->
    <rect x="-24" y="-72" width="48" height="22" rx="11" fill="#00B4D8"/>
    <text x="0" y="-57" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" text-anchor="middle">01</text>
    <!-- Label -->
    <text x="0" y="68" fill="#0F2137" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Offer &amp; Contracts</text>
    <text x="0" y="88" fill="#64748B" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">MoHRE aligned</text>
  </g>

  <!-- ================= STAGE 2 ================= -->
  <g transform="translate(312, 180)">
    <!-- Node -->
    <circle cx="0" cy="0" r="42" fill="#FFFFFF" stroke="#00B4D8" stroke-width="3" filter="url(#cardShadow)"/>
    <circle cx="0" cy="0" r="34" fill="#F0FDFA"/>
    <!-- Icon: User badge onboarding -->
    <circle cx="0" cy="-6" r="7" fill="none" stroke="#00B4D8" stroke-width="2"/>
    <path d="M-13 14 c0 -6 6 -8 13 -8 s13 2 13 8" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round"/>
    <!-- Stage Pill -->
    <rect x="-24" y="-72" width="48" height="22" rx="11" fill="#00B4D8"/>
    <text x="0" y="-57" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" text-anchor="middle">02</text>
    <!-- Label -->
    <text x="0" y="68" fill="#0F2137" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Onboarding</text>
    <text x="0" y="88" fill="#64748B" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Induction &amp; setup</text>
  </g>

  <!-- ================= STAGE 3 ================= -->
  <g transform="translate(504, 180)">
    <!-- Node -->
    <circle cx="0" cy="0" r="42" fill="#FFFFFF" stroke="#00B4D8" stroke-width="3" filter="url(#cardShadow)"/>
    <circle cx="0" cy="0" r="34" fill="#F0FDFA"/>
    <!-- Icon: Database / Folder -->
    <path d="M-12 -10 c0 -3 5 -5 12 -5 s12 2 12 5 v18 c0 3 -5 5 -12 5 s-12 -2 -12 -5 z" fill="none" stroke="#00B4D8" stroke-width="2"/>
    <path d="M-12 -2 c0 3 5 5 12 5 s12 -2 12 -5" fill="none" stroke="#00B4D8" stroke-width="2"/>
    <path d="M-12 7 c0 3 5 5 12 5 s12 -2 12 -5" fill="none" stroke="#00B4D8" stroke-width="2"/>
    <!-- Stage Pill -->
    <rect x="-24" y="-72" width="48" height="22" rx="11" fill="#00B4D8"/>
    <text x="0" y="-57" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" text-anchor="middle">03</text>
    <!-- Label -->
    <text x="0" y="68" fill="#0F2137" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Employee Records</text>
    <text x="0" y="88" fill="#64748B" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Digital personnel files</text>
  </g>

  <!-- ================= STAGE 4 ================= -->
  <g transform="translate(696, 180)">
    <!-- Node -->
    <circle cx="0" cy="0" r="42" fill="#FFFFFF" stroke="#00B4D8" stroke-width="3" filter="url(#cardShadow)"/>
    <circle cx="0" cy="0" r="34" fill="#F0FDFA"/>
    <!-- Icon: Clock / Calendar alert -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00B4D8" stroke-width="2"/>
    <polyline points="0 -6 0 0 5 3" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round"/>
    <circle cx="10" cy="-10" r="3" fill="#D4A853"/>
    <!-- Stage Pill -->
    <rect x="-24" y="-72" width="48" height="22" rx="11" fill="#00B4D8"/>
    <text x="0" y="-57" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" text-anchor="middle">04</text>
    <!-- Label -->
    <text x="0" y="68" fill="#0F2137" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Expiry Tracking</text>
    <text x="0" y="88" fill="#64748B" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Visas &amp; Emirates ID</text>
  </g>

  <!-- ================= STAGE 5 ================= -->
  <g transform="translate(888, 180)">
    <!-- Node -->
    <circle cx="0" cy="0" r="42" fill="#FFFFFF" stroke="#00B4D8" stroke-width="3" filter="url(#cardShadow)"/>
    <circle cx="0" cy="0" r="34" fill="#F0FDFA"/>
    <!-- Icon: Cycle arrows / amendments -->
    <path d="M-6 -10 l5 -4 v8 z" fill="#00B4D8"/>
    <path d="M6 10 l-5 4 v-8 z" fill="#00B4D8"/>
    <path d="M-1 -10 a10 10 0 0 1 11 10" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round"/>
    <path d="M1 10 a10 10 0 0 1 -11 -10" fill="none" stroke="#00B4D8" stroke-width="2" stroke-linecap="round"/>
    <!-- Stage Pill -->
    <rect x="-24" y="-72" width="48" height="22" rx="11" fill="#00B4D8"/>
    <text x="0" y="-57" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" text-anchor="middle">05</text>
    <!-- Label -->
    <text x="0" y="68" fill="#0F2137" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Contract Changes</text>
    <text x="0" y="88" fill="#64748B" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Promotions &amp; transfers</text>
  </g>

  <!-- ================= STAGE 6 ================= -->
  <g transform="translate(1080, 180)">
    <!-- Node -->
    <circle cx="0" cy="0" r="42" fill="#FFFFFF" stroke="#10B981" stroke-width="3" filter="url(#cardShadow)"/>
    <circle cx="0" cy="0" r="34" fill="#ECFDF5"/>
    <!-- Icon: Final settlement / handshake / check badge -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="#10B981" stroke-width="2"/>
    <polyline points="-5 0 -1 4 6 -4" fill="none" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Stage Pill -->
    <rect x="-24" y="-72" width="48" height="22" rx="11" fill="#10B981"/>
    <text x="0" y="-57" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" text-anchor="middle">06</text>
    <!-- Label -->
    <text x="0" y="68" fill="#0F2137" font-family="'Poppins', sans-serif" font-size="15" font-weight="700" text-anchor="middle">Final Settlement</text>
    <text x="0" y="88" fill="#64748B" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">Gratuity &amp; offboarding</text>
  </g>
</svg>